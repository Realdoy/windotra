name: Store catalog
on:
  push:
    branches: [main]
    paths: ["docs/store/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/store-index.py
      - run: |
          if git diff --quiet docs/store/index.json; then exit 0; fi
          git config user.name "windotra-store"
          git config user.email "store@users.noreply.github.com"
          git add docs/store/index.json
          git commit -m "Update the store catalog"
          git push
