name: Build and test Windows app
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        shell: powershell
        run: ./build.ps1
      - name: Self-test
        shell: powershell
        run: |
          $p = Start-Process ./dist/WinDotra.exe -ArgumentList '--self-test' -Wait -PassThru
          if (Test-Path ./dist/test-results.txt) { Get-Content ./dist/test-results.txt }
          if ($p.ExitCode -ne 0) { throw 'Tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: WinDotra-Windows
          path: dist/
